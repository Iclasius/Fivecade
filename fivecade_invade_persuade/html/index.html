<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Invade and Persuade</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Courier New", monospace;
  }
  #app {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.97);
  }
  #app.visible {
    display: block;
  }
  /* Cadre "borne" reel (bezel.png, fourni par l'utilisateur) etire
     jusqu'aux bords de l'ecran, meme principe que la borne Degenatron.
     La decoupe transparente est positionnee en % pour rester calee sur
     le cadre quelle que soit la taille d'ecran : native 169,163 ->
     1285,837 dans une image de 1448x1086, coins arrondis ~58px. */
  #cabinet {
    position: fixed;
    inset: 0;
    background: #000 url('bezel.png') no-repeat center / 100% 100%;
  }
  #screen-wrap {
    position: absolute;
    left: 11.67%;
    top: 15.01%;
    width: 77.14%;
    height: 62.15%;
    border-radius: 5.2% / 8.6%;
    overflow: hidden;
    background: #000;
  }
  #game-container {
    width: 100%;
    height: 100%;
  }
  /* object-fit: contain garde les proportions 16:9 du jeu (pas de pixel
     art deforme) : la decoupe du cadre etant plus large que 16:9 une fois
     etiree, de fines bandes noires peuvent apparaitre sur les cotes. */
  #game-container canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    object-fit: contain;
  }
  /* Voir updateCanvasSmoothing() : lissage quand l'affichage REDUIT le jeu. */
  #game-container canvas.smooth {
    image-rendering: auto !important;
  }
  #hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 6px; /* en bas : le haut de l'ecran est occupe par l'interface du jeu */
    text-align: center;
    color: #f0d9ff;
    font-size: 11px;
    text-shadow: 0 0 4px #000;
    pointer-events: none;
    opacity: 0.85;
    z-index: 2;
  }
  /* Journal d'erreurs visible directement a l'ecran - le F8 de FiveM
     n'affiche pas la console JS de la page NUI, donc c'est le seul
     moyen fiable de voir une erreur JS sans devtools externes. */
  #debug-log {
    display: none;
    position: absolute;
    left: 4px;
    top: 4px;
    right: 4px;
    max-height: 120px;
    margin: 0;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.8);
    border: 1px solid #ff3a5e;
    color: #ff9a9a;
    font-size: 9px;
    line-height: 1.3;
    padding: 4px;
    white-space: pre-wrap;
    pointer-events: none;
    z-index: 3;
  }
  #debug-log.visible {
    display: block;
  }
  /* Saisie du nom pour le classement en fin de partie - libre plutot
     que force au nom du personnage FiveM. */
  #name-entry {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.75);
    z-index: 4;
  }
  #name-entry.visible {
    display: flex;
  }
  #name-entry-box {
    background: #05070f;
    border: 2px solid #3ad6ff;
    border-radius: 8px;
    padding: 24px 32px;
    text-align: center;
    font-family: "Courier New", monospace;
  }
  #name-entry-label {
    color: #3ad6ff;
    font-size: 13px;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  #name-entry-input {
    display: block;
    width: 220px;
    background: #10142a;
    border: 2px solid #9be7ff;
    border-radius: 4px;
    color: #ffffff;
    font-family: "Courier New", monospace;
    font-size: 18px;
    text-align: center;
    padding: 6px 8px;
    margin: 0 auto 10px;
    text-transform: uppercase;
    outline: none;
  }
  #name-entry-hint {
    color: #9be7ff;
    font-size: 10px;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="cabinet">
      <div id="screen-wrap">
        <div id="game-container"></div>
        <div id="hint">ECHAP pour quitter</div>
        <pre id="debug-log"></pre>
        <div id="name-entry">
          <div id="name-entry-box">
            <div id="name-entry-label">TON NOM POUR LE CLASSEMENT</div>
            <input id="name-entry-input" maxlength="16" autocomplete="off" spellcheck="false" />
            <div id="name-entry-hint">ENTREE pour valider</div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="phaser.min.js"></script>
<script>
(function () {
  "use strict";

  var RESOURCE_NAME = (typeof GetParentResourceName === "function")
    ? GetParentResourceName()
    : "fivecade_invade_persuade";

  function nuiPost(name, data) {
    return fetch("https://" + RESOURCE_NAME + "/" + name, {
      method: "POST",
      headers: { "Content-Type": "application/json; charset=UTF-8" },
      body: JSON.stringify(data || {})
    }).catch(function () { /* contexte hors FiveM (previsualisation) */ });
  }

  var appEl = document.getElementById("app");
  var debugLogEl = document.getElementById("debug-log");

  function debugLog(text) {
    debugLogEl.classList.add("visible");
    debugLogEl.textContent += text + "\n";
    debugLogEl.scrollTop = debugLogEl.scrollHeight;
  }

  window.addEventListener("error", function (e) {
    debugLog("[erreur JS] " + e.message + " (" + e.filename + ":" + e.lineno + ")");
  });

  var currentPlayerName = "???";
  var currentBorneType = "invade";

  /* Auto-ouverture pour capture d'ecran/preview hors FiveM uniquement
   * (?autoopen=1) - sans effet en jeu, l'URL NUI reelle n'a jamais ce
   * parametre. */
  if (/[?&]autoopen=1/.test(location.search)) {
    window.addEventListener("load", function () {
      currentPlayerName = "Preview";
      openApp();
    });
  }

  /* Nettete du pixel art selon l'echelle d'affichage : le jeu est dessine
     en 720px de haut, mais en 1920x1080 la decoupe du cadre n'en fait que
     ~671 (echelle 0.93). En mode "pixelated", une reduction non entiere
     SUPPRIME des lignes de pixels (1 sur 14 environ : contours hachures) ;
     en dessous de 1 on passe donc en lissage (reduction propre, a peine
     plus douce), et on garde "pixelated" des que l'echelle est >= 1. */
  function updateCanvasSmoothing() {
    var wrap = document.getElementById("screen-wrap");
    var canvas = document.querySelector("#game-container canvas");
    if (!wrap || !canvas || !canvas.height) return;
    var scale = Math.min(wrap.clientWidth / canvas.width, wrap.clientHeight / canvas.height);
    canvas.classList.toggle("smooth", scale < 1);
  }
  window.addEventListener("resize", updateCanvasSmoothing);

  function openApp() {
    appEl.classList.add("visible");
    if (window.FiveCadeGame) {
      window.FiveCadeGame.onOpen(currentPlayerName, currentBorneType);
    }
    updateCanvasSmoothing();
    setTimeout(updateCanvasSmoothing, 300); // le canvas Phaser peut ne pas exister encore
  }

  function closeApp() {
    appEl.classList.remove("visible");
    /* Coupe la saisie du nom si elle etait en cours (Echap pendant le
     * game over) - sans ca l'ecran de saisie restait "arme" et pouvait
     * ressurgir par-dessus le menu a la prochaine ouverture. */
    if (window.FiveCadeBridge) {
      window.FiveCadeBridge.cancelNamePrompt();
    }
    if (window.FiveCadeGame) {
      window.FiveCadeGame.onClose();
    }
  }

  window.addEventListener("message", function (event) {
    var msg = event.data;
    if (!msg || !msg.type) {
      return;
    }
    if (msg.type === "fivecade_open") {
      currentPlayerName = msg.playerName || "???";
      currentBorneType = msg.borneType || "invade";
      openApp();
    } else if (msg.type === "fivecade_close") {
      closeApp();
    } else if (msg.type === "fivecade_scoresUpdated") {
      if (window.FiveCadeGame) {
        window.FiveCadeGame.onScoresUpdated(msg.scores || []);
      }
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && appEl.classList.contains("visible")) {
      event.preventDefault();
      // Echap referme d'abord un panneau ouvert (meilleurs scores) avant
      // de quitter la borne.
      if (window.FiveCadeGame && window.FiveCadeGame.consumeEscape && window.FiveCadeGame.consumeEscape()) return;
      nuiPost("fivecade_close");
      closeApp();
    }
  });

  var nameEntryEl = document.getElementById("name-entry");
  var nameEntryInput = document.getElementById("name-entry-input");
  /* Reference vers le listener keydown actif de promptName (s'il y en a
   * un) - necessaire pour pouvoir le retirer proprement si la borne est
   * fermee (Echap) pendant la saisie du nom, voir cancelNamePrompt. */
  var activeNameKeydownHandler = null;

  /* Pont utilise par game.js pour parler a FiveM - independant de Phaser. */
  window.FiveCadeBridge = {
    requestScores: function () {
      nuiPost("fivecade_requestScores");
    },
    submitScore: function (score, name) {
      nuiPost("fivecade_submitScore", { playerName: (name || currentPlayerName), score: score });
    },
    promptName: function (callback) {
      nameEntryInput.value = "";
      nameEntryInput.placeholder = "ANONYME";
      nameEntryEl.classList.add("visible");
      nameEntryInput.focus();

      function submit() {
        nameEntryEl.classList.remove("visible");
        nameEntryInput.removeEventListener("keydown", onKeydown);
        activeNameKeydownHandler = null;
        var chosen = nameEntryInput.value.trim();
        callback(chosen || "ANONYME");
      }

      function onKeydown(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          e.stopPropagation();
          submit();
        }
      }

      activeNameKeydownHandler = onKeydown;
      nameEntryInput.addEventListener("keydown", onKeydown);
    },
    cancelNamePrompt: function () {
      nameEntryEl.classList.remove("visible");
      if (activeNameKeydownHandler) {
        nameEntryInput.removeEventListener("keydown", activeNameKeydownHandler);
        activeNameKeydownHandler = null;
      }
    },
    quit: function () {
      nuiPost("fivecade_close");
      closeApp();
    }
  };
})();
</script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
