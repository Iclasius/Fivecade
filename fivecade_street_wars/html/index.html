<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Street Wars, Gang Wars Edition</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Courier New", monospace;
  }
  #app {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.97);
  }
  #app.visible {
    display: block;
  }
  /* Cadre de la borne (bezel_<couleur>.webp, 1536x1024 = 3:2) : chaque
     variante de prop a sa couleur. Le cadre est garde a ses proportions
     (pas etire) et pose PAR-DESSUS l'ecran : sa decoupe transparente
     masque proprement les coins arrondis de l'ecran. */
  #cabinet {
    position: absolute;
    inset: 0;
    margin: auto;
    width: min(100vw, calc(100vh * 3 / 2));
    height: min(100vh, calc(100vw * 2 / 3));
  }
  #bezel {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }
  /* Ecran : position de la decoupe du cadre (en %, reglee par borne dans
     BEZEL_SCREEN plus bas), avec un leger debord cache sous le cadre. Le
     jeu (4:3) est centre ; les bandes laterales prennent un fond neon. */
  #screen-wrap {
    position: absolute;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #1a1030 0%, #07050c 70%);
    z-index: 1;
  }
  #game-container {
    width: 100%;
    height: 100%;
  }
  #game-container canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    object-fit: contain;
  }
  /* Journal d'erreurs visible a l'ecran : le F8 de FiveM n'affiche pas la
     console JS de la NUI. */
  #debug-log {
    display: none;
    position: absolute;
    left: 4px;
    top: 4px;
    right: 4px;
    max-height: 120px;
    margin: 0;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.8);
    border: 1px solid #ff3a5e;
    color: #ff9a9a;
    font-size: 9px;
    line-height: 1.3;
    padding: 4px;
    white-space: pre-wrap;
    pointer-events: none;
    z-index: 3;
  }
  #debug-log.visible {
    display: block;
  }
  /* Saisie du nom du perso (page de selection). */
  #name-entry {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.55);
    z-index: 4;
  }
  #name-entry.visible {
    display: flex;
  }
  #name-entry-box {
    background: #0a0710;
    border: 3px solid #ffc21a;
    border-radius: 8px;
    padding: 22px 30px;
    text-align: center;
  }
  #name-entry-label {
    color: #ffc21a;
    font: bold 16px "Arial Black", Impact, sans-serif;
    margin-bottom: 12px;
  }
  #name-entry-input {
    display: block;
    width: 240px;
    background: #16121f;
    border: 2px solid #fff6a8;
    border-radius: 4px;
    color: #ffffff;
    font: bold 20px "Arial Black", Impact, sans-serif;
    text-align: center;
    text-transform: uppercase;
    padding: 6px 8px;
    margin: 0 auto 10px;
    outline: none;
  }
  #name-entry-hint {
    color: #c8c0d8;
    font-size: 11px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="cabinet">
    <img id="bezel" alt="" src="bezel_green.webp">
    <div id="screen-wrap">
      <div id="game-container"></div>
      <pre id="debug-log"></pre>
      <div id="name-entry">
        <div id="name-entry-box">
          <div id="name-entry-label">TON NOM</div>
          <input id="name-entry-input" maxlength="12" autocomplete="off" spellcheck="false" />
          <div id="name-entry-hint">ENTR&Eacute;E valider &nbsp;&middot;&nbsp; &Eacute;CHAP annuler</div>
        </div>
      </div>
    </div>
    </div>
  </div>

<script src="phaser.min.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  "use strict";

  var RESOURCE_NAME = (typeof GetParentResourceName === "function")
    ? GetParentResourceName()
    : "fivecade_street_wars";

  function nuiPost(name, data) {
    return fetch("https://" + RESOURCE_NAME + "/" + name, {
      method: "POST",
      headers: { "Content-Type": "application/json; charset=UTF-8" },
      body: JSON.stringify(data || {})
    }).catch(function () { /* hors FiveM (previsualisation) */ });
  }

  var appEl = document.getElementById("app");
  var debugLogEl = document.getElementById("debug-log");

  function debugLog(text) {
    debugLogEl.classList.add("visible");
    debugLogEl.textContent += text + "\n";
    debugLogEl.scrollTop = debugLogEl.scrollHeight;
  }

  window.addEventListener("error", function (e) {
    debugLog("[erreur JS] " + e.message + " (" + e.filename + ":" + e.lineno + ")");
  });

  var currentPlayerName = "???";

  /* Decoupe de l'ecran dans chaque cadre HD (pixels sur 1536x1024, mesures
   * sur les images) : gauche, haut, droite, bas. */
  var BEZEL_W = 1536, BEZEL_H = 1024;
  var BEZEL_SCREEN = {
    green:  [178, 116, 1360, 765],
    purple: [178, 116, 1361, 766],
    yellow: [178, 116, 1358, 766],
    blue:   [178, 116, 1361, 766]
  };
  var BLEED = 12; // debord (px source) cache sous le cadre

  function applyBezel(color) {
    if (!BEZEL_SCREEN[color]) color = "green";
    var r = BEZEL_SCREEN[color], wrap = document.getElementById("screen-wrap");
    document.getElementById("bezel").src = "bezel_" + color + ".webp";
    wrap.style.left = ((r[0] - BLEED) / BEZEL_W * 100) + "%";
    wrap.style.top = ((r[1] - BLEED) / BEZEL_H * 100) + "%";
    wrap.style.width = ((r[2] - r[0] + 1 + 2 * BLEED) / BEZEL_W * 100) + "%";
    wrap.style.height = ((r[3] - r[1] + 1 + 2 * BLEED) / BEZEL_H * 100) + "%";
  }
  applyBezel("green");

  /* Previsualisation hors FiveM uniquement (?autoopen=1). */
  if (/[?&]autoopen=1/.test(location.search)) {
    window.addEventListener("load", function () {
      currentPlayerName = "Preview";
      // &borne=purple : previsualiser une autre couleur de borne
      currentBorneColor = (location.search.match(/[?&]borne=([a-z]+)/) || [])[1] || "green";
      openApp();
      // ?demo=1 : partie entre 4 CPU a regarder (&speed=2 pour accelerer)
      var demo = /[?&]demo=1/.test(location.search);
      var speed = Number((location.search.match(/[?&]speed=([0-9.]+)/) || [])[1]) || 1;
      // &manche=45 : manches de 45 s (la police s'annonce des 12 s de jeu)
      var roundSec = Number((location.search.match(/[?&]manche=([0-9]+)/) || [])[1]) || 0;
      var cfg = roundSec ? { roundMs: roundSec * 1000 } : null;
      if (demo && window.FiveCadeGame) window.FiveCadeGame.startDemo(speed, cfg);
    });
  }

  var currentBorneColor = "green";

  function openApp() {
    applyBezel(currentBorneColor);
    appEl.classList.add("visible");
    if (window.FiveCadeGame) window.FiveCadeGame.onOpen(currentPlayerName, currentBorneColor);
  }

  function closeApp() {
    appEl.classList.remove("visible");
    if (window.FiveCadeBridge) window.FiveCadeBridge.cancelNamePrompt(false);
    if (window.FiveCadeGame) window.FiveCadeGame.onClose();
  }

  /* Tous les messages du jeu en ligne (serveur -> borne) arrivent en
   * type "sw" ; game.js les route vers la page affichee. */
  function onServerMessage(t, d) {
    if (window.FiveCadeGame) window.FiveCadeGame.onNet(t, d || {});
  }

  window.addEventListener("message", function (event) {
    var msg = event.data;
    if (!msg || !msg.type) return;
    if (msg.type === "fivecade_open") {
      currentPlayerName = msg.playerName || "???";
      currentBorneColor = msg.borneColor || "green";
      openApp();
    } else if (msg.type === "fivecade_close") {
      closeApp();
    } else if (msg.type === "sw") {
      onServerMessage(msg.t, msg.d);
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && appEl.classList.contains("visible")) {
      event.preventDefault();
      if (nameEntryEl.classList.contains("visible")) { bridge.cancelNamePrompt(true); return; }
      // Echap remonte d'un niveau (salon -> liste -> menu) avant de quitter la borne.
      if (window.FiveCadeGame && window.FiveCadeGame.consumeEscape()) return;
      bridge.quit();
    }
  });

  /* Saisie du nom : case vide, on tape au clavier, Retour arriere efface,
   * Entree valide. Vide = prenom par defaut du perso (placeholder). */
  var nameEntryEl = document.getElementById("name-entry");
  var nameEntryInput = document.getElementById("name-entry-input");
  var namePrompt = null; // { onOk, onCancel }
  // Jeu 100 % clavier : la saisie du nom ne perd jamais le focus.
  nameEntryInput.addEventListener("blur", function () {
    if (namePrompt) setTimeout(function () { if (namePrompt) nameEntryInput.focus(); }, 0);
  });
  nameEntryInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && namePrompt) {
      e.preventDefault();
      e.stopPropagation();
      var p = namePrompt, value = nameEntryInput.value.trim().toUpperCase();
      bridge.cancelNamePrompt(false);
      p.onOk(value);
    }
  });

  var bridge = window.FiveCadeBridge = {
    promptName: function (placeholder, onOk, onCancel) {
      // Case vide a chaque fois : le joueur tape son nom au clavier (le prenom
      // par defaut s'affiche en grise tant que rien n'est ecrit).
      namePrompt = { onOk: onOk, onCancel: onCancel };
      nameEntryInput.value = "";
      nameEntryInput.placeholder = placeholder || "";
      nameEntryEl.classList.add("visible");
      nameEntryInput.focus();
      nameEntryInput.select();
    },
    /* notify = true : previent la page (Echap) ; false : fermeture silencieuse. */
    cancelNamePrompt: function (notify) {
      var p = namePrompt;
      namePrompt = null;
      nameEntryEl.classList.remove("visible");
      nameEntryInput.blur();
      if (notify && p && p.onCancel) p.onCancel();
    },
    send: function (t, d) {
      if (window.SWMockNet) return window.SWMockNet.fromClient(t, d || {});
      nuiPost("sw_send", { t: t, d: d || {} });
    },
    isFiveM: function () {
      return typeof GetParentResourceName === "function" || !!window.SWMockNet;
    },
    quit: function () {
      if (window.SWMockNet) window.SWMockNet.fromClient("bye", {});
      nuiPost("fivecade_close");
      closeApp();
    }
  };
})();
</script>
<script>
/* Test du mode en ligne hors FiveM (?mocknet=1) : charge un faux serveur
 * dans la page. Jamais actif en jeu (l'URL NUI n'a pas ce parametre). */
if (/[?&]mocknet=1/.test(location.search)) {
  document.write('<script src="../../tools/street_wars_mocknet.js"><\/script>');
  document.write('<script src="../server/main.js"><\/script>');
}
</script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
