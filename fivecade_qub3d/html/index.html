<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Qub3d</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Courier New", monospace;
  }
  #app {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.97);
  }
  #app.visible {
    display: block;
  }
  /* Cadre "borne" reel (bezel.png) - CONTRAIREMENT a
     fivecade_degenatron_penetrator/html/index.html (etire jusqu'aux bords,
     ratio bezel proche du 4:3/ecran donc peu visible), le bezel de Qub3d
     est un PNG PORTRAIT (1122x1402, ratio ~0.80) alors qu'un ecran FiveM
     reel est quasi toujours en LARGESCREEN (~1.78 pour du 16:9) - un simple
     "100% 100%" etire la largeur et la hauteur par des facteurs totalement
     differents, ce qui deforme le cadre ET la zone de jeu de façon
     disproportionnee (mesure : sur 1920x1080, la zone de jeu prevue a un
     ratio de 0.75 s'affichait en fait a 1.67, quasiment inversee - retour
     utilisateur "ecrase"). Fix : #cabinet est desormais redimensionne en
     JS (sizeCabinetToBezelAspect, voir le script principal plus bas) pour
     TOUJOURS garder le ratio natif du PNG (letterbox noir sur les cotes/
     haut-bas selon l'ecran, jamais de deformation) - #screen-wrap peut
     alors rester en % simples relatifs a #cabinet, qui a maintenant
     toujours le meme ratio que l'image source, sur n'importe quel ecran.
     Decoupe transparente mesuree au pixel pres (Pillow, bbox alpha) :
     native 128,136 -> 991,1108 dans l'image 1122x1402 (ratio ~0.888).
     Largeur resserree pour matcher exactement le ratio du jeu (0.75,
     GAME_WIDTH/GAME_HEIGHT) : 729/972px sur 863/972px de decoupe
     disponible, centree horizontalement. */
  #cabinet {
    position: fixed;
    background: #000 url('bezel.png') no-repeat center / 100% 100%;
  }
  #screen-wrap {
    position: absolute;
    left: 17.38%;
    top: 9.70%;
    width: 64.97%;
    height: 69.33%;
    border-radius: 2.5%;
    overflow: hidden;
    background: #000;
  }
  #game-container {
    width: 100%;
    height: 100%;
  }
  #game-container canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }
  /* Plateau/pieces en vrai 3D (Three.js), superpose au canvas Phaser qui
     ne garde que le HUD/menu (voir ThreeBoard dans game.js) - fond
     transparent, ne bloque pas les clics/touches (pointer-events none). */
  #three-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  #hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 6px;
    text-align: center;
    color: #b9f3ff;
    font-size: 11px;
    text-shadow: 0 0 4px #000;
    pointer-events: none;
    opacity: 0.85;
    z-index: 2;
  }
  /* Journal d'erreurs visible directement a l'ecran - le F8 de FiveM
     n'affiche pas la console JS de la page NUI. */
  #debug-log {
    display: none;
    position: absolute;
    left: 4px;
    top: 4px;
    right: 4px;
    max-height: 120px;
    margin: 0;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.8);
    border: 1px solid #ff3a5e;
    color: #ff9a9a;
    font-size: 9px;
    line-height: 1.3;
    padding: 4px;
    white-space: pre-wrap;
    pointer-events: none;
    z-index: 3;
  }
  #debug-log.visible {
    display: block;
  }
  /* Saisie du nom - affichee seulement quand le score entre dans le top 10
     de cette borne (decide cote game.js), pas a chaque partie. */
  #name-entry {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.75);
    z-index: 4;
  }
  #name-entry.visible {
    display: flex;
  }
  #name-entry-box {
    background: #05070f;
    border: 2px solid #3ad6ff;
    border-radius: 8px;
    padding: 24px 32px;
    text-align: center;
    font-family: "Courier New", monospace;
  }
  #name-entry-label {
    color: #3ad6ff;
    font-size: 13px;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  #name-entry-input {
    display: block;
    width: 220px;
    background: #10142a;
    border: 2px solid #9be7ff;
    border-radius: 4px;
    color: #ffffff;
    font-family: "Courier New", monospace;
    font-size: 18px;
    text-align: center;
    padding: 6px 8px;
    margin: 0 auto 10px;
    text-transform: uppercase;
    outline: none;
  }
  #name-entry-hint {
    color: #9be7ff;
    font-size: 10px;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="cabinet">
      <div id="screen-wrap">
        <div id="game-container"></div>
        <canvas id="three-canvas"></canvas>
        <div id="hint">ECHAP pour quitter</div>
        <pre id="debug-log"></pre>
        <div id="name-entry">
          <div id="name-entry-box">
            <div id="name-entry-label">NOUVEAU RECORD - TON NOM</div>
            <input id="name-entry-input" maxlength="16" autocomplete="off" spellcheck="false" />
            <div id="name-entry-hint">ENTREE pour valider</div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="three.min.js"></script>
<script src="phaser.min.js"></script>
<script>
(function () {
  "use strict";

  var RESOURCE_NAME = (typeof GetParentResourceName === "function")
    ? GetParentResourceName()
    : "fivecade_qub3d";

  function nuiPost(name, data) {
    return fetch("https://" + RESOURCE_NAME + "/" + name, {
      method: "POST",
      headers: { "Content-Type": "application/json; charset=UTF-8" },
      body: JSON.stringify(data || {})
    }).catch(function () { /* contexte hors FiveM (previsualisation) */ });
  }

  var appEl = document.getElementById("app");
  var debugLogEl = document.getElementById("debug-log");
  var cabinetEl = document.getElementById("cabinet");

  /* Garde le cadre (bezel.png, PNG portrait 1122x1402) a son ratio natif
   * quelle que soit la taille/le ratio de l'ecran reel - voir le
   * commentaire CSS de #cabinet pour le pourquoi (un simple CSS
   * "100% 100%" deformait fortement le cadre ET la zone de jeu sur un
   * ecran large). Centre le cadre dans le noir de #app, letterbox sur les
   * cotes ou en haut/bas selon que l'ecran est plus large ou plus etroit
   * que le bezel. */
  var BEZEL_ASPECT = 1122 / 1402;
  function sizeCabinetToBezelAspect() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var w, h;
    if (vw / vh > BEZEL_ASPECT) {
      h = vh;
      w = h * BEZEL_ASPECT;
    } else {
      w = vw;
      h = w / BEZEL_ASPECT;
    }
    cabinetEl.style.width = w + "px";
    cabinetEl.style.height = h + "px";
    cabinetEl.style.left = ((vw - w) / 2) + "px";
    cabinetEl.style.top = ((vh - h) / 2) + "px";
  }
  sizeCabinetToBezelAspect();
  window.addEventListener("resize", sizeCabinetToBezelAspect);

  function debugLog(text) {
    debugLogEl.classList.add("visible");
    debugLogEl.textContent += text + "\n";
    debugLogEl.scrollTop = debugLogEl.scrollHeight;
  }

  window.addEventListener("error", function (e) {
    debugLog("[erreur JS] " + e.message + " (" + e.filename + ":" + e.lineno + ")");
  });

  var currentPlayerName = "???";

  /* Auto-ouverture pour capture d'ecran/preview hors FiveM uniquement
   * (?autoopen=1) - sans effet en jeu, l'URL NUI reelle n'a jamais ce
   * parametre. */
  if (/[?&]autoopen=1/.test(location.search)) {
    window.addEventListener("load", function () {
      currentPlayerName = "Preview";
      openApp();
    });
  }

  function openApp() {
    appEl.classList.add("visible");
    if (window.FiveCadeGame) {
      window.FiveCadeGame.onOpen(currentPlayerName);
    }
  }

  function closeApp() {
    appEl.classList.remove("visible");
    if (window.FiveCadeBridge) {
      window.FiveCadeBridge.cancelNamePrompt();
    }
    if (window.FiveCadeGame) {
      window.FiveCadeGame.onClose();
    }
  }

  window.addEventListener("message", function (event) {
    var msg = event.data;
    if (!msg || !msg.type) {
      return;
    }
    if (msg.type === "fivecade_open") {
      currentPlayerName = msg.playerName || "???";
      openApp();
    } else if (msg.type === "fivecade_close") {
      closeApp();
    } else if (msg.type === "fivecade_scoresUpdated") {
      if (window.FiveCadeGame) {
        window.FiveCadeGame.onScoresUpdated(msg.scores || []);
      }
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && appEl.classList.contains("visible")) {
      event.preventDefault();
      nuiPost("fivecade_close");
      closeApp();
    }
  });

  var nameEntryEl = document.getElementById("name-entry");
  var nameEntryInput = document.getElementById("name-entry-input");
  var activeNameKeydownHandler = null;

  /* Pont utilise par game.js pour parler a FiveM - independant de Phaser. */
  window.FiveCadeBridge = {
    requestScores: function () {
      nuiPost("fivecade_requestScores");
    },
    submitScore: function (score, name) {
      nuiPost("fivecade_submitScore", { playerName: (name || currentPlayerName), score: score });
    },
    /* N'est appele par game.js que lorsque le score entre reellement dans
     * le top 10 de cette borne - champ vide, aucune trace du nom FiveM. */
    promptName: function (callback) {
      nameEntryInput.value = "";
      nameEntryInput.placeholder = "ANONYME";
      nameEntryEl.classList.add("visible");
      nameEntryInput.focus();

      function submit() {
        nameEntryEl.classList.remove("visible");
        nameEntryInput.removeEventListener("keydown", onKeydown);
        activeNameKeydownHandler = null;
        var chosen = nameEntryInput.value.trim();
        callback(chosen || "ANONYME");
      }

      function onKeydown(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          e.stopPropagation();
          submit();
        }
      }

      activeNameKeydownHandler = onKeydown;
      nameEntryInput.addEventListener("keydown", onKeydown);
    },
    cancelNamePrompt: function () {
      nameEntryEl.classList.remove("visible");
      if (activeNameKeydownHandler) {
        nameEntryInput.removeEventListener("keydown", activeNameKeydownHandler);
        activeNameKeydownHandler = null;
      }
    },
    quit: function () {
      nuiPost("fivecade_close");
      closeApp();
    }
  };
})();
</script>
<script src="game.js"></script>
</body>
</html>
